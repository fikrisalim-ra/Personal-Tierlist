<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tierlist Pribadi</title>
  <link rel="stylesheet" href="style.css?v=3f2">
</head>

<body>
  <header>
    <h1>Tierlist Pribadi</h1>
    <div class="lists">
      <select id="listSelect" title="Pilih tierlist"></select>
      <button id="btnNewList">+ Baru</button>
      <button id="btnRenameList">Ganti nama</button>
      <button id="btnDeleteList">Hapus</button>
    </div>
    <span id="status"></span>
    <span id="usage"></span>
    <div class="actions">
      <button id="btnUndo" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
      <button id="btnRedo" title="Redo (Ctrl+Y)" disabled>↷ Redo</button>
      <button id="btnFit" title="Cara gambar ditampilkan di kotak">Gambar: Potong</button>
      <button id="btnExport" title="Simpan semua (gambar + susunan) jadi satu file JSON">Export</button>
      <button id="btnImport" title="Ganti tierlist dengan isi file JSON">Import</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </header>
  <div id="tiers"></div>
  <div class="addrow"><button id="btnAddTier">+ Tambah tier</button><button id="btnFoldAll">Lipat semua</button><button
      id="btnUnfoldAll">Buka semua</button></div>
  <div class="pool">
    <div class="zone" id="pool" data-zone="pool"></div>
  </div>

  <script src="app.js?v=3f2"></script>
</body>

</html>
